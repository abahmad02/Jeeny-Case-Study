# Test Profile Configuration
spring.application.name=mini-ride-booking-system-test

# H2 Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Test Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable H2 Console in tests
spring.h2.console.enabled=false

# JWT Test Configuration
app.jwt.secret=testSecretKey123456789012345678901234567890
app.jwt.expiration-ms=3600000

# Disable DataInitializer in tests
spring.datasource.initialization-mode=never

# Logging Configuration for tests
logging.level.com.jeeny.ridehailing=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
